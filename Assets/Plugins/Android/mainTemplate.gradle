// GENERATED BY UNITY. REMOVE OR MODIFY WITH CAUTION.
buildscript {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
        // Required for legacy Facebook SDK dependencies
        maven { url 'https://maven.google.com' }
        maven { url "https://jitpack.io" }
    }
}

// --- Dependency Resolution Strategy ---
// Prevents version conflicts (critical for FB + AdMob coexistence)
configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
        force 'androidx.core:core:1.10.1'
        force 'androidx.work:work-runtime:2.7.1'
        force 'androidx.appcompat:appcompat:1.6.1'
        force 'androidx.annotation:annotation:1.6.0'
        force 'com.google.android.gms:play-services-basement:18.4.0'
    }
}

apply plugin: 'com.android.library'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // The following are placeholders; EDM4U will insert its resolved versions here.
    // For example:
    // implementation 'com.google.android.gms:play-services-ads:24.5.0'
    // implementation 'com.facebook.android:facebook-core:[17.0.0,18)'
}

android {
	aaptOptions {
		noCompress = ['.ress', '.resource', '.obb'] + unityStreamingAssets.tokenize(', ')
		ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
	}

    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        consumerProguardFiles "proguard-unity.txt"
    }

    lintOptions {
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-unity.txt'
        }
    }

    // Required for AndroidX + Jetifier
    packagingOptions {
        pickFirst '**/*.so'
        exclude 'META-INF/*.kotlin_module'
    }

    // Fix for duplicate META-INF files during build
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
}
